name: Publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # This repository also runs GitHub's built-in branch Pages publisher.
      # Publish the Vite artifact last so source HTML cannot overwrite it.
      - name: Wait for branch Pages publisher
        uses: actions/github-script@v7
        with:
          script: |
            let absent = 0;
            for (let attempt = 0; attempt < 90; attempt++) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                ...context.repo, head_sha: context.sha, per_page: 100
              });
              const legacy = runs.filter(run => run.name === 'pages build and deployment');
              if (legacy.length && legacy.every(run => run.status === 'completed')) {
                core.info('Branch Pages publisher finished; publishing compiled artifact next.');
                return;
              }
              if (!legacy.length && ++absent >= 6) {
                core.info('No branch publisher found; repository may use Actions-only Pages.');
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            core.setFailed('Branch Pages publisher has not finished; refusing competing deployment.');
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published versions and release identity
        uses: actions/github-script@v7
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        with:
          script: |
            const url = process.env.PAGE_URL;
            const fresh = path => new URL(path + '?release=' + context.sha, url);
            for (let attempt = 0; attempt < 12; attempt++) {
              try {
                const releaseResponse = await fetch(fresh('release.json'), { cache: 'no-store' });
                if (!releaseResponse.ok) throw new Error('Release manifest not visible yet');
                const release = await releaseResponse.json();
                if (release.commit !== context.sha) throw new Error('Previous deployment still visible');
                if (JSON.stringify(release.versions.map(version => version.id)) !== '["v1","v4"]') throw new Error('Expected only V1 and V4');
                for (const retired of ['v2', 'v3']) {
                  const removed = await fetch(fresh('versions/' + retired + '/'), { cache: 'no-store' });
                  if (removed.status !== 404) throw new Error('Retired version still published: ' + retired);
                }
                const portal = await fetch(fresh(''), { cache: 'no-store' });
                const portalHTML = await portal.text();
                if (!portal.ok || !portalHTML.includes('可使用的版本')) throw new Error('Portal unavailable');
                for (const version of release.versions) {
                  if (!portalHTML.includes('./versions/' + version.id + '/')) throw new Error('Missing version link');
                  const pageURL = fresh('versions/' + version.id + '/');
                  const page = await fetch(pageURL, { cache: 'no-store' });
                  const html = await page.text();
                  const script = html.match(/src="([^" ]+\.js)"/);
                  if (!page.ok || !script || !html.includes('返回版本入口') || !html.includes(release.buildId)) throw new Error('Compiled version unavailable');
                  const bundle = await fetch(new URL(script[1], pageURL));
                  const code = await bundle.text();
                  const headings = ['現金與本次目標', '持倉與交易限制', '調整方案', '情境試算', '歷史快照'];
                  if (!bundle.ok || !headings.every(label => code.includes(label))) throw new Error('Missing application sections');
                }
                core.info('Verified release ' + context.sha + ' and all published version URLs: ' + url);
                return;
              } catch (error) { core.info(String(error)); }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            core.setFailed('Published release verification failed.');
