name: Publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # This repository also runs GitHub's built-in branch Pages publisher.
      # Publish the Vite artifact last so source HTML cannot overwrite it.
      - name: Wait for branch Pages publisher
        uses: actions/github-script@v7
        with:
          script: |
            let absent = 0;
            for (let attempt = 0; attempt < 90; attempt++) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                ...context.repo, head_sha: context.sha, per_page: 100
              });
              const legacy = runs.filter(run => run.name === 'pages build and deployment');
              if (legacy.length && legacy.every(run => run.status === 'completed')) {
                core.info('Branch Pages publisher finished; publishing compiled artifact next.');
                return;
              }
              if (!legacy.length && ++absent >= 6) {
                core.info('No branch publisher found; repository may use Actions-only Pages.');
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            core.setFailed('Branch Pages publisher has not finished; refusing competing deployment.');
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public portal and original version
        uses: actions/github-script@v7
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        with:
          script: |
            const url = process.env.PAGE_URL;
            for (let attempt = 0; attempt < 12; attempt++) {
              try {
                const portal = await fetch(url, { cache: 'no-store' });
                const portalHTML = await portal.text();
                if (!portal.ok || !portalHTML.includes('可使用的版本') || !portalHTML.includes('./versions/v1/')) {
                  throw new Error('Version portal not visible yet');
                }
                const originalURL = new URL('versions/v1/', url);
                const page = await fetch(originalURL, { cache: 'no-store' });
                const html = await page.text();
                const script = html.match(/src="([^"]+\.js)"/);
                if (!page.ok || !script || !html.includes('返回版本入口')) throw new Error('Compiled HTML not visible yet');
                const bundle = await fetch(new URL(script[1], originalURL));
                const code = await bundle.text();
                const headings = ['現金與本次目標', '持倉與交易限制', '調整方案', '情境試算', '歷史快照'];
                if (!bundle.ok || !headings.every(label => code.includes(label)) || code.includes('市場觀察筆記')) {
                  throw new Error('Expected five-section application bundle not visible yet');
                }
                core.info(`Verified public version portal and original five-section website: ${url}`);
                return;
              } catch (error) {
                core.info(String(error));
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            core.setFailed('Public portal or original version verification failed.');
